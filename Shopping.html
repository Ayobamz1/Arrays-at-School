<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Splice Array</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css"
    />
  </head>
  <body>
    <div class="col-9 col-lg-5 col-md-6 mx-auto mt-5 shadow p-5">
      <h2 class="text-center text-decoration-underline py-3">
        Mini Shopping Cart
      </h2>
      <input
        id="input"
        type="text"
        class="form-control form-control-sm shadow-none"
        placeholder="Enter your Item here"
      />
      <button onclick="addItem()" class="w-100 btn btn-success mt-3">
        Add Item
      </button>
      <button onclick="deleteLast()" class="w-100 btn btn-dark mt-3">
        Delete Item
      </button>
    </div>
    <div id="display" class="text-center mt-3">Your Item will show here</div>
    <script src="Shopping.js"></script>
  </body>
</html>
